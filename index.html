function detectIndustry(text){const t=(text||'').toLowerCase();if(/f&b|đồ ăn|nhà hàng|quán ăn|cà phê|cafe|đồ uống|thực phẩm|ăn uống|bánh/.test(t))return 'F&B';if(/công nghệ|phần mềm|app|ứng dụng|saas|ai|dữ liệu|code|nền tảng số|website/.test(t))return 'Công nghệ';if(/thời trang|quần áo|mỹ phẩm|làm đẹp/.test(t))return 'Bán lẻ & làm đẹp';if(/giáo dục|khóa học|đào tạo|gia sư/.test(t))return 'Giáo dục';if(/du lịch|khách sạn|homestay|lưu trú/.test(t))return 'Du lịch';if(/nông nghiệp|nông sản|trồng trọt|chăn nuôi/.test(t))return 'Nông nghiệp';if(/vận chuyển|giao hàng|logistics|kho vận/.test(t))return 'Logistics';if(/y tế|phòng khám|sức khỏe|dược/.test(t))return 'Y tế';if(/tài chính|ngân hàng|đầu tư|fintech/.test(t))return 'Tài chính';return 'Dịch vụ & thương mại';}
function financialModel(){const a=state.aiData;const capital=Math.max(0,Number(a.capital)||0),cost=Math.max(0,Number(a.cost)||0);const industry=a.industry||detectIndustry(a.business);const factor={'F&B':1.48,'Công nghệ':2.05,'Bán lẻ & làm đẹp':1.62,'Giáo dục':1.78,'Du lịch':1.52,'Nông nghiệp':1.36,'Logistics':1.55,'Y tế':1.72,'Tài chính':1.88,'Dịch vụ & thương mại':1.58}[industry]||1.58;const months=parseInt(a.duration)||6;const ramp=months<=3?.72:months<=6?.88:months<=12?1:1.12;const base=Math.max(cost*1.03, cost*factor*ramp);const capitalSupport=cost>0?Math.min(.25,capital/(Math.max(1,cost*months))*0.12):0;const revenue=Math.round(base*(1+capitalSupport));const profit=revenue-cost;const breakEven=profit>0?Math.ceil(capital/profit):null;return {capital,cost,industry,months,revenue,profit,breakEven};}

function ai(){let s=state.aiStep;let head=pageHead('AI Simulator','Kiểm tra ý tưởng trước khi đầu tư thật.');let steps=`<div class="stepper">${[1,2,3,4].map(n=>`<div class="step ${s>=n?'done':''}"></div>`).join('')}</div>`;if(s===1)return head+steps+`<div class="card"><h3>01 · Mô hình kinh doanh</h3><p>Cho AI biết bạn định kinh doanh gì.</p><div class="field"><label>Bạn kinh doanh sản phẩm / dịch vụ gì?</label><textarea id="aBusiness" placeholder="Ví dụ: nền tảng giao đồ ăn healthy cho dân văn phòng...">${esc(state.aiData.business)}</textarea></div><div class="two"><div class="field"><label>Vốn ban đầu (VNĐ)</label><input id="aCapital" type="number" placeholder="150000000" value="${esc(state.aiData.capital)}"></div><div class="field"><label>Chi phí vận hành / tháng</label><input id="aCost" type="number" placeholder="25000000" value="${esc(state.aiData.cost)}"></div></div><div class="field"><label>Mô hình vận hành</label><select id="aModel"><option value="">Chọn mô hình</option>${['Bán trực tiếp','Nền tảng online','B2B doanh nghiệp','Đăng ký định kỳ','Marketplace','Dịch vụ theo yêu cầu','Sản xuất & phân phối'].map(x=>`<option ${state.aiData.model===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn full" onclick="saveAI1()">Tiếp tục: mô phỏng thị trường →</button></div>`;if(s===2){let page=head+steps+`<div class="card"><h3>02 · Bối cảnh thị trường</h3><p>Chọn khu vực và khoảng thời gian để mô phỏng.</p><div class="field"><label>Ngành nghề kinh doanh</label><select id="aIndustry">${['Tự nhận diện từ mô tả','F&B','Công nghệ','Bán lẻ & làm đẹp','Giáo dục','Du lịch','Nông nghiệp','Logistics','Y tế','Tài chính','Dịch vụ & thương mại'].map(x=>`<option value="${x==='Tự nhận diện từ mô tả'?'':x}" ${(state.aiData.industry||'')===(x==='Tự nhận diện từ mô tả'?'':x)?'selected':''}>${x}</option>`).join('')}</select></div><div class="two"><div class="field"><label>Tỉnh / thành phố (63 tỉnh thành)</label><select id="aProvince" onchange="updateDistricts()"><option value="">Chọn tỉnh/thành</option>${provinces63.map(x=>`<option ${state.aiData.province===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Quận / huyện / khu vực</label><select id="aDistrict"><option value="">Toàn tỉnh/thành phố</option></select></div></div><div class="field"><label>Phân khúc / đặc điểm thị trường (không bắt buộc)</label><textarea id="aMarket" placeholder="VD: khách hàng 20–35 tuổi, đối thủ, mức giá...">${esc(state.aiData.market)}</textarea></div><div class="field"><label>Thời gian dự báo</label><select id="aDuration">${['3 tháng','6 tháng','12 tháng','24 tháng','36 tháng'].map(x=>`<option ${state.aiData.duration===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Phân khúc / đặc điểm thị trường (không bắt buộc)</label><textarea id="aExtra" placeholder="Đối thủ, hành vi khách hàng, mức giá...">${esc(state.aiData.extra||'')}</textarea></div><button class="btn secondary" onclick="state.aiStep=1;render()">← Quay lại</button> <button class="btn" onclick="saveAI2()">Bắt đầu mô phỏng</button></div>`;setTimeout(()=>{updateDistricts();const d=document.getElementById('aDistrict');if(d&&state.aiData.district)d.value=state.aiData.district},0);return page}if(s===3){if(!state.aiResults)return head+steps+`<div class="card loading"><div class="spinner"></div><h3>AI đang mô phỏng thị trường…</h3><p>Đang phân tích ngành, chi phí, quy mô thị trường và kịch bản tăng trưởng.</p><div class="sub">Vui lòng đợi một chút. Kết quả sẽ xuất hiện khi hoàn tất.</div></div>`;let fm=financialModel(),capital=fm.capital,cost=fm.cost,revenue=fm.revenue,breakEven=fm.breakEven;let bars=Array.from({length:Math.min(12,fm.months)},(_,i)=>Math.max(12,Math.min(96,Math.round((revenue*(.58+.42*(i+1)/Math.min(12,fm.months))/Math.max(1,revenue))*85))));return head+steps+`<div class="card"><span class="pill green">MÔ PHỎNG HOÀN TẤT</span><h3>Kịch bản kinh doanh dự kiến</h3><p>${esc(state.aiData.business)} · ${esc(state.aiData.market)} · ${esc(state.aiData.duration)}</p><div class="chart">${bars.map((b,i)=>`<div class="bar" style="height:${b}%" title="Tháng ${i+1}"></div>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:10px;color:#7183a1;margin-top:6px"><span>Tháng 1</span><span>Tháng ${Math.ceil(fm.months/2)}</span><span>Tháng ${fm.months}</span></div></div><div class="metrics"><div class="metric"><small>Doanh thu dự kiến / tháng</small><strong>${(revenue/1000000).toFixed(1)} triệu</strong></div><div class="metric"><small>Điểm hòa vốn</small><strong>${breakEven===null?'Chưa hòa vốn':`~ ${breakEven} tháng`}</strong></div><div class="metric"><small>Chi phí vận hành</small><strong>${(cost/1000000).toFixed(1)} tr/tháng</strong></div><div class="metric"><small>Kịch bản tăng trưởng</small><strong>${fm.profit>0?'Có lãi dự kiến':'Cần tối ưu'}</strong></div></div><div class="footnote">Ước tính sơ bộ dựa trên vốn ${capital.toLocaleString('vi-VN')}đ, chi phí ${cost.toLocaleString('vi-VN')}đ/tháng, ngành ${fm.industry} và thời hạn ${fm.months} tháng. Đây là mô hình minh họa, không phải cam kết doanh thu.</div><button class="btn full" onclick="startRisks()">Phân tích cảnh báo rủi ro →</button>`}if(s===4)return head+steps+(!state.riskReady?`<div class="card loading"><div class="spinner"></div><h3>Đang quét rủi ro thị trường…</h3><p>AI đang đối chiếu ngành nghề, địa bàn, mô hình vận hành và cấu trúc chi phí.</p><div class="sub">Bước này mất khoảng 10 giây.</div></div>`:`<div class="card"><span class="pill orange">CẦN LƯU Ý</span><h3>Cảnh báo rủi ro theo mô hình</h3><p>Phân tích sơ bộ cho <b>${esc(state.aiData.business)}</b> tại ${esc(state.aiData.market)}.</p>${industryRisks().map((r,i)=>`<div class="card risk"><h3>${i+1}. ${r[0]}</h3><p>${r[1]}</p></div>`).join('')}<button class="btn full" onclick="state.aiStep=1;state.aiResults=false;state.riskReady=false;render()">Mô phỏng ý tưởng khác</button></div>`);}

function casesListHtml(){return ''}function refreshList(){}function openCase(id){let b=casesBase[id%casesBase.length];document.getElementById('overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)this.innerHTML='' "><div class="sheet"><div class="eyebrow">CASE BRIEF · INNOSPACE</div><h3>${esc(b[0])}</h3><p>${esc(b[2])} · ${esc(b[1])}</p><p><b>Bối cảnh:</b> Doanh nghiệp cần một giải pháp khả thi, có thể thử nghiệm trong 8–12 tuần và có chỉ số đo lường cụ thể.</p><p><b>Yêu cầu:</b> Phân tích vấn đề, xác định nhóm khách hàng, đề xuất giải pháp, kế hoạch triển khai, ngân sách dự kiến và KPI đánh giá.</p><p><b>Tiêu chí đánh giá:</b> Mức độ phù hợp, tính khả thi, sáng tạo, tác động và chất lượng dữ liệu hỗ trợ.</p><div class="card risk"><b>Bảo vệ ý tưởng</b><p>Trước khi thỏa thuận, doanh nghiệp chỉ xem tóm tắt. Bản giải pháp đầy đủ nên được khóa và chỉ mở sau khi hai bên xác nhận điều khoản và phí. Đây là quy trình đề xuất; prototype chưa có cơ chế pháp lý/kỹ thuật thực thi.</p></div><div class="field"><label>Tóm tắt giải pháp (bản xem trước)</label><textarea id="caseSummary" placeholder="Mô tả hướng tiếp cận, không đưa bí quyết cốt lõi vào bản xem trước..."></textarea></div><button class="btn full" onclick="submitCase(${id})">Gửi bản tóm tắt</button><button class="btn secondary full" onclick="document.getElementById('overlay').innerHTML=''">Đóng</button></div></div>`}function submitCase(id){let s=document.getElementById('caseSummary').value.trim();if(!s){toast('Hãy nhập bản tóm tắt trước khi gửi.');return}state.caseSubmitted.push(id);document.getElementById('overlay').innerHTML='';toast('Đã ghi nhận bản tóm tắt demo. Đánh giá dự kiến sau 5–7 ngày; Point phụ thuộc kết quả.');}

 if(state.spaceMode==='ideas'){

Name" value="${esc(state.user)}"></div><button class="btn full" onclick="state.user=document.getElementById('profileName').value.trim()||'Thành viên';document.getElementById('overlay').innerHTML='';render()">Lưu hồ sơ</button></div></div>`}function editAchievements(){document.getElementById('overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)this.innerHTML='' "><div class="sheet"><h3>Thêm thành tích / dự án</h3><div class="field"><label>Tên dự án</label><input id="achTitle" placeholder="Tên dự án đã làm"></div><div class="field"><label>Vai trò và kết quả</label><textarea id="achDesc" placeholder="Bạn phụ trách gì? Kết quả có thể đo lường?"></textarea></div><div class="field"><label>Link portfolio (nếu có)</label><input placeholder="https://..."></div><button class="btn full" onclick="let t=document.getElementById('achTitle').value.trim();if(!t){toast('Nhập tên dự án.');return}document.getElementById('overlay').innerHTML='';toast('Đã thêm thành tích “'+t+'” vào bản demo.')">Lưu thành tích</button></div></div>`}
function point(){return pageHead('Point Wallet','Theo dõi điểm tích lũy và quyền lợi có thể sử dụng.')+`<div class="points"><small>SỐ DƯ POINT</small><div class="num">${state.points.toLocaleString('vi-VN')} <small>pt</small></div><small>Điểm minh họa trong prototype</small></div><div class="section-title"><h3>Lịch sử tích lũy</h3></div>${[['Hoàn thành khảo sát hợp lệ','+120','Hôm nay'],['Đóng góp case study','+300','18/10/2026'],['Hoàn thiện hồ sơ','+50','15/10/2026'],['Tham gia cộng đồng','+80','12/10/2026']].map(x=>`<div class="card"><div class="pointrow"><div><h3>${x[0]}</h3><p>${x[2]}</p></div><strong style="color:#159475">${x[1]} pt</strong></div></div>`).join('')}<div class="section-title"><h3>Sử dụng Point</h3></div><div class="card"><h3>🎟️ Mở khóa phân tích nâng cao</h3><p>Nhận báo cáo chuyên sâu hơn cho một lượt mô phỏng.</p><span class="pill">500 Point</span><button class="btn full" onclick="redeem(500,'Phân tích nâng cao')">Đổi quyền lợi</button></div><div class="card"><h3>🚀 Làm nổi bật hồ sơ</h3><p>Giúp hồ sơ xuất hiện nổi bật hơn trong matching (mô phỏng).</p><span class="pill">300 Point</span><button class="btn full" onclick="redeem(300,'Làm nổi bật hồ sơ')">Đổi quyền lợi</button></div><div class="footnote">Point không có giá trị tiền mặt trong prototype. Cơ chế đổi điểm thật cần điều khoản và hệ thống giao dịch riêng.</div>`}function redeem(n,name){if(state.points<n){toast('Bạn chưa đủ Point để đổi quyền lợi này.');return}state.points-=n;render();toast('Đã đổi '+name+' (demo).')}
function render(){nav();let c=document.getElementById('content');c.innerHTML=state.page==='Home'?home():state.page==='AI Simulator'?ai():state.page==='Case'?cases():state.page==='Matching'?matching():state.page==='Space'?space():state.page==='Me'?me():point();c.scrollTop=0}state.page='Home';render();setInterval(()=>{let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false})},10000);
</script></body></html>
